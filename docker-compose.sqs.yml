# Override: point api + worker at LocalStack SQS instead of Redis Streams.
# Usage: docker compose --profile aws-local -f docker-compose.yml -f docker-compose.sqs.yml up -d
#
# Switching back: just drop the -f docker-compose.sqs.yml. Same compose project,
# no container rebuild needed — env-only override.

services:
  api:
    environment:
      QUEUE_BACKEND: sqs
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localstack:4566/000000000000/deployflow-deployments
      SQS_DLQ_URL: http://localstack:4566/000000000000/deployflow-deployments-dlq
      # Phase 9 — S3 + ECR via LocalStack
      ARTIFACTS_BACKEND: s3
      S3_ARTIFACTS_BUCKET: deployflow-artifacts
      S3_ARTIFACTS_PREFIX: deployments/
      ECR_REPOSITORY_URI: 000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud/deployflow
    depends_on:
      localstack:
        condition: service_healthy

  worker:
    environment:
      QUEUE_BACKEND: sqs
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localstack:4566/000000000000/deployflow-deployments
      SQS_DLQ_URL: http://localstack:4566/000000000000/deployflow-deployments-dlq
      ARTIFACTS_BACKEND: s3
      S3_ARTIFACTS_BUCKET: deployflow-artifacts
      S3_ARTIFACTS_PREFIX: deployments/
      ECR_REPOSITORY_URI: 000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud/deployflow
    depends_on:
      localstack:
        condition: service_healthy
